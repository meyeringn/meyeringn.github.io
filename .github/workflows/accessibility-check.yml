name: Accessibility check

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1"   # Mondays, 8:17am Eastern (13:17 UTC)

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1 @axe-core/playwright@4
          npx playwright install --with-deps chromium
      - name: Check every live tool
        run: node .github/a11y-check.mjs
